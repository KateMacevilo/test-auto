# URL тестируемого сервиса (без контекстного пути)
# AGENTS.md: значения в этом файле — заглушки, заполнить реальными
prior.suite.common.autotest.url=http://localhost:8080

# --- Аутентификация (Bearer token) ---
# Если задан auth.static-token, используется он, иначе токен запрашивается с auth.url (client_credentials)
# AGENTS.md: механизм auth — допущение
auth.url=
auth.client-id=
auth.client-secret=
auth.static-token=

# --- x-jwt-assertion (claims) ---
# AGENTS.md: состав claims — допущение по скриншоту сервиса
jwt.user-id=12345
jwt.subscriber=true
jwt.user-categories=INDIVIDUAL
jwt.tax-number=
jwt.organization=
jwt.application-uuid=11111111-2222-3333-4444-555555555555
jwt.key-type=API_KEY
jwt.application-name=prior-ob-svc-api-listpassportsconsent-tests

# --- База данных (реальная БД сервиса) ---
# AGENTS.md: PostgreSQL и креды — допущение, заполнить реальными
db.url=jdbc:postgresql://localhost:5432/consents
db.user=postgres
db.password=postgres

# --- WireMock (заглушки даунстримов сервиса) ---
# Admin API WireMock, доступного ИЗ тестируемого сервиса (см. AGENTS.md, раздел WireMock)
# AGENTS.md: URL — заглушка, заполнить реальным
wiremock.url=http://localhost:8089
# Кейсы с заглушками WireMock запускать только локально: в k8s-прогоне выключить через
# env WIREMOCK_CASES_ENABLED=false (или -Dwiremock.cases.enabled=false) — такие кейсы скипнутся
wiremock.cases.enabled=true

